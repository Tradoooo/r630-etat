# Netdata r630 — installation en mode utilisateur (sans root)
# Écrit par b le 2026-11-11. Accès : http://100.124.18.48:19999 (tailnet)
#
# Le static build officiel est compilé pour /opt/netdata, inaccessible sans sudo.
# Les variables NETDATA_*_DIR ne sont PAS lues par le binaire : les chemins sont
# donc posés ici via les clés de config `[global] * directory`, et le launcher
# bin/netdata-user passe ce fichier avec -c. Garder des chemins absolus.

[global]
    hostname = r630
    stock config directory = /home/baptiste/opt/netdata/usr/lib/netdata/conf.d
    lib directory = /home/baptiste/opt/netdata/var/lib/netdata
    cache directory = /home/baptiste/opt/netdata/var/cache/netdata
    log directory = /home/baptiste/opt/netdata/var/log/netdata
    plugins directory = /home/baptiste/opt/netdata/usr/libexec/netdata/plugins.d
    web files directory = /home/baptiste/opt/netdata/usr/share/netdata/web
    home directory = /home/baptiste

[web]
    # Uniquement loopback + IP Tailscale : jamais exposé sur le LAN physique.
    bind to = 127.0.0.1 100.124.18.48
    default port = 19999
    mode = static-threaded
    # Pas d'ACL "allow connections from" : elle faisait fermer les connexions
    # locales (code 000 sur 127.0.0.1). Le bind ci-dessus suffit à restreindre
    # l'accès au tailnet + loopback.

[db]
    mode = dbengine
    # Disque racine à 85 % : historique volontairement court.
    dbengine tier 0 disk space MB = 512
    dbengine tier 1 disk space MB = 256
    page cache size MB = 32

[ml]
    # Le serveur est saturé par la CI : pas d'entraînement ML en continu.
    enabled = no

[cloud]
    enabled = no

[health]
    # alarm-notify.sh sort en erreur (exit 1) à chaque alerte et tenterait un
    # envoi vers l'extérieur. Les alertes restent visibles dans le dashboard
    # (badges rouges + onglet Alerts) ; rien ne quitte la machine.
    script to execute on alarm = /bin/true

[plugins]
    proc = yes
    diskspace = yes
    go.d = yes
    # apps.plugin sans root ne voit que les processus de baptiste et loggue
    # ~2 erreurs/seconde dans journald pour chaque processus système : coupe.
    # Pour le reactiver : apps = yes (puis systemctl --user restart netdata).
    apps = no
    # systemd-journal.plugin ne peut pas lire /var/log/journal sans root :
    # il logguait 27 erreurs/min. scripts.d : repertoire absent, meme bruit.
    systemd-journal = no
    scripts.d = no
    # Les suivants exigent root ou un démon absent : coupés pour éviter le bruit.
    cgroups = no
    tc = no
    debugfs = no
    ebpf = no
    perf = no
    slabinfo = no
    charts.d = no
    python.d = no

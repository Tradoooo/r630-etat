# Surcharge utilisateur de go.d.conf pour le Netdata du r630 (sans root).
# Fusionné avec usr/lib/netdata/conf.d/go.d.conf par netdata.
#
# logind : interroge systemd-logind via D-Bus, ce qui échoue depuis le namespace
# utilisateur ("context deadline exceeded" toutes les secondes sur un serveur
# déjà saturé en IO). Les autres modules sont laissés à leur valeur par défaut :
# go.d auto-détecte et désactive tout seul ce qu'il ne peut pas atteindre.

modules:
  logind: no
